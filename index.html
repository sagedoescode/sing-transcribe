<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sing Transcribe</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 800px at 20% 10%, #1b2440 0%, #0a0d18 60%, #05070d 100%);
      color: #e9ecf5;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(22, 26, 40, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px 24px 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .sub { color: #8a93ab; font-size: 13px; margin-bottom: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.10);
      background: #2b3350;
      color: #e9ecf5;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, opacity .2s;
    }
    button:hover:not(:disabled) { background: #36406a; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .rec { background: #c2344a; border-color: #c2344a; }
    .rec:hover:not(:disabled) { background: #d63e56; }
    .go { background: #2f7d49; border-color: #2f7d49; }
    .go:hover:not(:disabled) { background: #369155; }
    select {
      background: #1c2238;
      color: #e9ecf5;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }
    .status {
      margin: 14px 0;
      font-size: 13px;
      color: #a9b3cc;
      min-height: 18px;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: #c2344a; margin-right: 8px;
      animation: pulse 1s infinite;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
    audio { width: 100%; margin-top: 10px; }
    .out {
      margin-top: 14px;
      white-space: pre-wrap;
      background: #0e1222;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
      font-size: 14px;
      color: #e9ecf5;
    }
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }
    .progress.on { display: block; }
    .bar { height: 100%; width: 0%; background: #4f7dff; transition: width .2s; }
    .tiny { font-size: 12px; color: #6e7794; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sing Transcribe</h1>
    <div class="sub">Record isolated vocals, then transcribe locally with Whisper. First run downloads the model (cached after).</div>

    <div class="row">
      <button id="recBtn" class="rec">Record</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="transcribeBtn" class="go" disabled>Transcribe</button>
      <select id="modelSel" title="Model size">
        <option value="Xenova/whisper-tiny">tiny (fast, ~75MB)</option>
        <option value="Xenova/whisper-base" selected>base (balanced, ~145MB)</option>
        <option value="Xenova/whisper-small">small (accurate, ~480MB)</option>
      </select>
      <select id="langSel" title="Language">
        <option value="en" selected>English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="auto">Auto detect</option>
      </select>
    </div>

    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Idle.</div>

    <audio id="player" controls></audio>
    <div class="out" id="out">Transcript will appear here.</div>
    <div class="tiny">Runs fully in your browser. No uploads. Model is cached by the browser after first download.</div>
  </div>

  <script type="module">
    import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
    env.allowLocalModels = false;

    const recBtn = document.getElementById("recBtn");
    const stopBtn = document.getElementById("stopBtn");
    const transcribeBtn = document.getElementById("transcribeBtn");
    const player = document.getElementById("player");
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");
    const modelSel = document.getElementById("modelSel");
    const langSel = document.getElementById("langSel");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");

    let mediaRecorder = null;
    let chunks = [];
    let audioBlob = null;
    let transcriber = null;
    let loadedModel = null;

    function setStatus(msg, recording = false) {
      statusEl.innerHTML = (recording ? '<span class="dot"></span>' : "") + msg;
    }

    async function ensureModel() {
      const id = modelSel.value;
      if (transcriber && loadedModel === id) return transcriber;
      progress.classList.add("on");
      setStatus("Loading model " + id + "...");
      transcriber = await pipeline("automatic-speech-recognition", id, {
        progress_callback: (p) => {
          if (p.status === "progress" && p.progress != null) {
            bar.style.width = Math.round(p.progress) + "%";
            setStatus("Downloading " + (p.file || "model") + " " + Math.round(p.progress) + "%");
          }
        },
      });
      loadedModel = id;
      progress.classList.remove("on");
      bar.style.width = "0%";
      setStatus("Model ready.");
      return transcriber;
    }

    recBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
        });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        mediaRecorder.onstop = () => {
          audioBlob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
          player.src = URL.createObjectURL(audioBlob);
          transcribeBtn.disabled = false;
          setStatus("Recorded " + (audioBlob.size / 1024).toFixed(0) + " KB. Ready to transcribe.");
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        recBtn.disabled = true;
        stopBtn.disabled = false;
        transcribeBtn.disabled = true;
        setStatus("Recording...", true);
      } catch (err) {
        setStatus("Mic error: " + err.message);
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      recBtn.disabled = false;
      stopBtn.disabled = true;
    });

    async function blobToMono16k(blob) {
      const arr = await blob.arrayBuffer();
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC({ sampleRate: 16000 });
      const decoded = await ctx.decodeAudioData(arr);
      if (decoded.numberOfChannels === 1) return decoded.getChannelData(0);
      const out = new Float32Array(decoded.length);
      for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
        const data = decoded.getChannelData(ch);
        for (let i = 0; i < data.length; i++) out[i] += data[i] / decoded.numberOfChannels;
      }
      return out;
    }

    transcribeBtn.addEventListener("click", async () => {
      if (!audioBlob) return;
      try {
        transcribeBtn.disabled = true;
        recBtn.disabled = true;
        const t = await ensureModel();
        setStatus("Decoding audio...");
        const audio = await blobToMono16k(audioBlob);
        setStatus("Transcribing...");
        const lang = langSel.value;
        const opts = { chunk_length_s: 30, stride_length_s: 5, return_timestamps: false };
        if (lang !== "auto") { opts.language = lang; opts.task = "transcribe"; }
        const result = await t(audio, opts);
        out.textContent = (result.text || "").trim() || "(no speech detected)";
        setStatus("Done.");
      } catch (err) {
        setStatus("Error: " + err.message);
        console.error(err);
      } finally {
        transcribeBtn.disabled = false;
        recBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

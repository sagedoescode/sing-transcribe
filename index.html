<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sing Transcribe</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 800px at 20% 10%, #1b2440 0%, #0a0d18 60%, #05070d 100%);
      color: #e9ecf5;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(22, 26, 40, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px 24px 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .sub { color: #8a93ab; font-size: 13px; margin-bottom: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.10);
      background: #2b3350;
      color: #e9ecf5;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, opacity .2s;
    }
    button:hover:not(:disabled) { background: #36406a; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .go { background: #2f7d49; border-color: #2f7d49; }
    .go:hover:not(:disabled) { background: #369155; }
    .stop { background: #c2344a; border-color: #c2344a; }
    .stop:hover:not(:disabled) { background: #d63e56; }
    select {
      background: #1c2238;
      color: #e9ecf5;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }
    .status {
      margin: 14px 0;
      font-size: 13px;
      color: #a9b3cc;
      min-height: 18px;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: #c2344a; margin-right: 8px;
      animation: pulse 1s infinite;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
    audio { width: 100%; margin-top: 10px; }
    .out {
      margin-top: 14px;
      white-space: pre-wrap;
      background: #0e1222;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
      font-size: 14px;
      color: #e9ecf5;
    }
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }
    .progress.on { display: block; }
    .bar { height: 100%; width: 0%; background: #4f7dff; transition: width .2s; }
    .tiny { font-size: 12px; color: #6e7794; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sing Transcribe</h1>
    <div class="sub">Hit Transcribe, sing, hit Stop. Local Whisper, no uploads.</div>

    <div class="row">
      <button id="mainBtn" class="go">Transcribe</button>
      <button id="stopBtn" class="stop" disabled>Stop</button>
      <button id="clearBtn">Clear</button>
      <select id="langSel" title="Language">
        <option value="en" selected>English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="auto">Auto detect</option>
      </select>
    </div>

    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Idle.</div>

    <audio id="player" controls></audio>
    <div class="out" id="out">Transcript will appear here.</div>
    <div class="tiny">Runs fully in your browser. No uploads. Model cached after first download.</div>
  </div>

  <script type="module">
    import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
    env.allowLocalModels = false;

    const MODEL_ID = "Xenova/whisper-base";

    const mainBtn = document.getElementById("mainBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearBtn = document.getElementById("clearBtn");
    const player = document.getElementById("player");
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");
    const langSel = document.getElementById("langSel");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");

    let mediaRecorder = null;
    let chunks = [];
    let audioBlob = null;
    let transcriber = null;
    let recordingStream = null;

    function setStatus(msg, recording = false) {
      statusEl.innerHTML = (recording ? '<span class="dot"></span>' : "") + msg;
    }

    async function ensureModel() {
      if (transcriber) return transcriber;
      progress.classList.add("on");
      setStatus("Loading Whisper model...");
      transcriber = await pipeline("automatic-speech-recognition", MODEL_ID, {
        progress_callback: (p) => {
          if (p.status === "progress" && p.progress != null) {
            bar.style.width = Math.round(p.progress) + "%";
            setStatus("Downloading " + (p.file || "model") + " " + Math.round(p.progress) + "%");
          }
        },
      });
      progress.classList.remove("on");
      bar.style.width = "0%";
      return transcriber;
    }

    async function blobToMono16k(blob) {
      const arr = await blob.arrayBuffer();
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC({ sampleRate: 16000 });
      const decoded = await ctx.decodeAudioData(arr);
      if (decoded.numberOfChannels === 1) return decoded.getChannelData(0);
      const merged = new Float32Array(decoded.length);
      for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
        const data = decoded.getChannelData(ch);
        for (let i = 0; i < data.length; i++) merged[i] += data[i] / decoded.numberOfChannels;
      }
      return merged;
    }

    async function startRecording() {
      try {
        recordingStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
        });
      } catch (err) {
        setStatus("Mic error: " + err.message);
        return;
      }
      chunks = [];
      mediaRecorder = new MediaRecorder(recordingStream);
      mediaRecorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      mediaRecorder.onstop = async () => {
        audioBlob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
        player.src = URL.createObjectURL(audioBlob);
        recordingStream?.getTracks().forEach(t => t.stop());
        recordingStream = null;
        await transcribeNow();
      };
      mediaRecorder.start();
      mainBtn.disabled = true;
      stopBtn.disabled = false;
      clearBtn.disabled = true;
      setStatus("Recording... sing now, then Stop.", true);
    }

    async function transcribeNow() {
      if (!audioBlob) return;
      try {
        mainBtn.disabled = true;
        stopBtn.disabled = true;
        clearBtn.disabled = true;
        const t = await ensureModel();
        setStatus("Decoding audio...");
        const audio = await blobToMono16k(audioBlob);
        setStatus("Transcribing...");
        const lang = langSel.value;
        const opts = { chunk_length_s: 30, stride_length_s: 5, return_timestamps: false };
        if (lang !== "auto") { opts.language = lang; opts.task = "transcribe"; }
        const result = await t(audio, opts);
        out.textContent = (result.text || "").trim() || "(no speech detected)";
        setStatus("Done. Hit Clear to try again.");
      } catch (err) {
        setStatus("Error: " + err.message);
        console.error(err);
      } finally {
        mainBtn.disabled = false;
        stopBtn.disabled = true;
        clearBtn.disabled = false;
      }
    }

    mainBtn.addEventListener("click", startRecording);

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        setStatus("Stopping...");
        mediaRecorder.stop();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
      recordingStream?.getTracks().forEach(t => t.stop());
      recordingStream = null;
      mediaRecorder = null;
      chunks = [];
      audioBlob = null;
      player.removeAttribute("src");
      player.load();
      out.textContent = "Transcript will appear here.";
      mainBtn.disabled = false;
      stopBtn.disabled = true;
      clearBtn.disabled = false;
      setStatus("Cleared.");
    });
  </script>
</body>
</html>
